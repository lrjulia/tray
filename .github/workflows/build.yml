name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # Optional: add these repository secrets to sign with Developer ID and notarize.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -E 'MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build (universal, unsigned)
        run: |
          xcodebuild -project Tray.xcodeproj -scheme Tray -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign (ad-hoc)
        if: env.MACOS_CERT_P12 == ''
        run: codesign --force --deep --sign - build/Build/Products/Release/Tray.app

      - name: Sign (Developer ID)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN=build.keychain
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" build/Build/Products/Release/Tray.app

      - name: Zip
        run: ditto -c -k --keepParent build/Build/Products/Release/Tray.app Tray.zip

      - name: Notarize
        if: env.MACOS_CERT_P12 != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit Tray.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/Build/Products/Release/Tray.app
          rm Tray.zip
          ditto -c -k --keepParent build/Build/Products/Release/Tray.app Tray.zip

      - name: Checksum
        run: shasum -a 256 Tray.zip | tee Tray.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Tray
          path: |
            Tray.zip
            Tray.zip.sha256

      # A release is published when main has a version (MARKETING_VERSION in project.yml) that has
      # no release yet, or when a v* tag is pushed. To release: bump the version and push to main.
      - name: Publish release
        if: (github.ref == 'refs/heads/main' && steps.version.outputs.released == 'false') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Tray ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            Tray.zip
            Tray.zip.sha256
          generate_release_notes: true

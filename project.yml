# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Tray
options:
  bundleIdPrefix: app.tray
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Tray:
    type: application
    platform: macOS
    sources:
      - Sources/Tray
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Tray
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    entitlements:
      path: Resources/Tray.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tray.Tray
        PRODUCT_NAME: Tray
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
